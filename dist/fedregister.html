   Not here yet (no dead API surface ships — ROADMAP Phase 1 exit gate):
   - Suite.key / Suite.relay land in Phase 2 Batch C with their first users.
   - Protocol-gated service-worker registration lands in Phase 3 (PWA.md). */
(() => {
"use strict";

/* Safe storage backend: memory fallback when localStorage is unavailable
   (private mode, file:// quirks). Persistence is polite, never fatal. */
const backend = (() => {
  try {
    const k = "__suite_t";
    localStorage.setItem(k, "1");
    localStorage.removeItem(k);
    return localStorage;
  } catch (e) {
    const mem = new Map();
    return {
      getItem: k => (mem.has(k) ? mem.get(k) : null),
      setItem: (k, v) => { mem.set(k, String(v)); },
      removeItem: k => { mem.delete(k); }
    };
  }
})();

function assertNamespaced(key) {
  if (typeof key !== "string" || !key.startsWith("suite.")) {
    throw new Error('Suite.store keys must start with "suite." - got: ' + key);
  }
}

const store = {
  /* v1 wrote some keys as bare strings ("dark", "F") and some as JSON.
     Read both: JSON first, raw string when parsing fails. */
  get(key, fallback = null) {
    assertNamespaced(key);
    const raw = backend.getItem(key);
    if (raw === null) return fallback === undefined ? null : fallback;
    try { return JSON.parse(raw); } catch (e) { return raw; }
  },
  /* Strings are written bare so v1 tools keep reading their keys unchanged. */
  set(key, value) {
    assertNamespaced(key);
    try {
      backend.setItem(key, typeof value === "string" ? value : JSON.stringify(value));
    } catch (e) { /* quota exceeded or denied - never fatal */ }
  },
  /* Ordered migrations gated by suite.meta.schemaVersion (ARCHITECTURE.md §6).
     Baseline v2 = v1 layout, so the suite-wide list starts empty. */
  migrate(fns) {
    const KEY = "suite.meta.schemaVersion";
    let v = store.get(KEY, 0);
    if (typeof v !== "number" || !isFinite(v)) v = 0;
    for (; v < fns.length; v++) fns[v]();
    store.set(KEY, fns.length);
  }
};

/* ---- theme: the suite.theme convention (absent = follow system) ---- */
function activeTheme() {
  return document.documentElement.dataset.theme ||
    (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
}
function paintThemeButtons() {
  document.querySelectorAll("#themeBtn, .theme-btn").forEach(btn => {
    btn.setAttribute("aria-pressed", String(activeTheme() === "dark"));
  });
}
const theme = {
  init() {
    const saved = store.get("suite.theme");
    if (saved === "light" || saved === "dark") {
      document.documentElement.dataset.theme = saved;
    }
    document.querySelectorAll("#themeBtn, .theme-btn").forEach(btn => {
      btn.setAttribute("aria-label", "Toggle light/dark theme");
      btn.addEventListener("click", theme.toggle);
    });
    paintThemeButtons();
  },
  toggle() {
    const next = activeTheme() === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    store.set("suite.theme", next);
    paintThemeButtons();
  }
};

/* ---- fetch: one helper for the whole suite ----
   Returns an envelope {v, t, stale, fromCache}:
     v         the JSON payload
     t         epoch ms the payload was fetched
     stale     true when the network failed and this is the cached fallback -
               render the "Offline - cached from <time>" card
     fromCache true when no request was made (fresh within ttl, or stale)

   (the v1 envelope - v1 caches keep working). ttl is in ms; 0 = always fetch. */
async function fetchJSON(url, opts = {}) {
  const {
    timeout = 12000, cacheKey = null, ttl = 0, fallbackToCache = true,
    accept = "application/json", tries = 1
  } = opts;
  const fullKey = cacheKey ? "suite.cache." + cacheKey : null;

  let cached = null;
  if (fullKey) {
    const e = store.get(fullKey);
    if (e && typeof e === "object" && "t" in e && "v" in e) cached = e;
  }
  if (cached && ttl > 0 && Date.now() - cached.t < ttl) {
    return { v: cached.v, t: cached.t, stale: false, fromCache: true };
  }

  let lastErr = null;
  const n = Math.max(1, tries);
  for (let i = 0; i < n; i++) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeout);
    try {
      const r = await fetch(url, {
        signal: ctrl.signal,
        headers: accept ? { "Accept": accept } : {}
      });
      clearTimeout(timer);
      if (r.ok) {
        const v = await r.json();
        const t = Date.now();
        if (fullKey) store.set(fullKey, { t, v });
        return { v, t, stale: false, fromCache: false };
      }
      lastErr = new Error("HTTP " + r.status);
      if (r.status === 404) break; /* a 404 will not improve on retry */
    } catch (e) {
      clearTimeout(timer);
      lastErr = (e && e.name === "AbortError") ? new Error("timed out") : e;
    }
    if (i < n - 1) await new Promise(res => setTimeout(res, 600 * (i + 1)));
  }
  if (fallbackToCache && cached) {
    return { v: cached.v, t: cached.t, stale: true, fromCache: true };
  }
  throw lastErr || new Error("fetch failed");
}

/* ---- escaping: mandatory for remote data interpolated into innerHTML ---- */
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ---- a11y: mark an async result container so screen readers hear updates ---- */
function liveRegion(el) {
  el.setAttribute("aria-live", "polite");
  return el;
}

/* ---- shared location: the suite.location key, used by ~20 tools ---- */
const loc = {
  get() {
    const l = store.get("suite.location");
    if (l && typeof l === "object" && isFinite(l.lat) && isFinite(l.lon)) {
      return { lat: +l.lat, lon: +l.lon, label: l.label || "" };
    }
    return null;
  },
  set(l) {
    if (!l || !isFinite(l.lat) || !isFinite(l.lon)) {
      throw new Error("Suite.location.set needs {lat, lon}");
    }
    store.set("suite.location", { lat: +l.lat, lon: +l.lon, label: l.label || "" });
  }
};

window.Suite = { theme, fetchJSON, store, esc, liveRegion, location: loc };
})();

<script>
"use strict";

Suite.theme.init();

/* ---- helpers ---- */
/* v1 cache envelope kept byte-compatible: suite.cache.fedregister.<date> = {t, v: docsArray}.
   Suite.fetchJSON's built-in cacheKey would store the whole API response object instead of
   the results array, breaking v1-written caches — so the envelope stays managed here while
   the network request itself goes through Suite.fetchJSON. */
function cacheGet(key){
  const e = Suite.store.get("suite.cache.fedregister." + key);
  return (e && typeof e === "object" && "t" in e && "v" in e) ? e : null;
}
function cacheSet(key, v){ Suite.store.set("suite.cache.fedregister." + key, { t: Date.now(), v: v }); }
function fmtTime(ms){
  const d = new Date(ms);
  return d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
}
function todayISO(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
/* map API type string -> {code, label, cls} */
function typeInfo(t){
  switch (t) {
    case "Rule": return { code: "RULE", label: "Rule", cls: "t-rule" };
    case "Proposed Rule": return { code: "PRORULE", label: "Proposed Rule", cls: "t-prorule" };
    case "Notice": return { code: "NOTICE", label: "Notice", cls: "t-notice" };
    case "Presidential Document": return { code: "PRESDOCS", label: "Presidential", cls: "t-presdoc" };
    default: return { code: "OTHER", label: t || "Document", cls: "t-notice" };
  }
}

/* ---- state ---- */
const state = { date: null, docs: [], type: "ALL", agencies: new Set(), stamp: "" };
const listEl = Suite.liveRegion(document.getElementById("list"));
const statsEl = Suite.liveRegion(document.getElementById("stats"));
const typePillsEl = document.getElementById("typePills");
const agencyBar = document.getElementById("agencyBar");
const agencyChipsEl = document.getElementById("agencyChips");
const agencyCountEl = document.getElementById("agencyCount");
const dateInput = document.getElementById("dateInput");
const stampEl = Suite.liveRegion(document.getElementById("stamp"));

function msgCard(title, body, btnLabel, btnFn){
  listEl.textContent = "";
  const c = document.createElement("div"); c.className = "card-msg";
  const h = document.createElement("h3"); h.textContent = title;
  const p = document.createElement("p"); p.textContent = body;
  c.append(h, p);
  if (btnLabel){ const b = document.createElement("button"); b.textContent = btnLabel; b.addEventListener("click", btnFn); c.append(b); }
  listEl.append(c);
}

/* FR data for a past date never changes — a cached past issue is served without a network
   hit, as in v1. Today's issue can still gain documents during the day, so the current
   date refreshes on the declared good-citizen interval (manifest cacheTtlMin: 60). */
const TTL = 60 * 60 * 1000;

async function load(date, opts){
  opts = opts || {};
  state.date = date;
  const cached = cacheGet(date);
  if (cached && !opts.force && (date < todayISO() || Date.now() - cached.t < TTL)){
    apply(cached.v, cached.t);
    return;
  }
  if (!cached) msgCard("Loading…", "Fetching documents published on " + date + ".");
  const fields = ["title","type","abstract","html_url","agencies","document_number","publication_date"];
  let url = "https://www.federalregister.gov/api/v1/documents.json?per_page=1000&order=newest";
  url += "&conditions%5Bpublication_date%5D%5Bis%5D=" + encodeURIComponent(date);
  fields.forEach(function(f){ url += "&fields%5B%5D=" + f; });
  try {
    const r = await Suite.fetchJSON(url, { accept: "application/json" });
    const docs = r.v.results || [];
    cacheSet(date, docs);
    apply(docs, r.t);
  } catch(e){
    if (cached){ apply(cached.v, cached.t, true); }
    else {
      msgCard("Couldn't reach the Federal Register",
        "Check your connection and try again. " + (e && e.message ? "(" + e.message + ")" : ""),
        "Retry", function(){ load(date, { force: true }); });
    }
  }
}

function apply(docs, stampMs, stale){
  state.docs = docs;
  state.stamp = stampMs ? (stale ? "offline — data from " : "data from ") + fmtTime(stampMs) : "";
  state.agencies = new Set();
  stampEl.textContent = state.stamp;
  buildAgencyChips();
  renderStats();
  renderTypePills();
  render();
}

function agencyNamesOf(d){
  const out = [];
  (d.agencies || []).forEach(function(a){ if (a && a.name) out.push(a.name); });
  return out;
}

function buildAgencyChips(){
  const counts = {};
  state.docs.forEach(function(d){
    agencyNamesOf(d).forEach(function(n){ counts[n] = (counts[n] || 0) + 1; });
  });
  const names = Object.keys(counts).sort(function(a,b){ return counts[b] - counts[a] || a.localeCompare(b); });
  agencyChipsEl.textContent = "";
  if (!names.length){ agencyBar.hidden = true; return; }
  agencyBar.hidden = false;
  agencyCountEl.textContent = "(" + names.length + ")";
  names.forEach(function(n){
    const b = document.createElement("button");
    b.type = "button";
    b.className = "achip";
    b.textContent = n + " · " + counts[n];
    b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", function(){
      const on = !state.agencies.has(n);
      if (on) state.agencies.add(n); else state.agencies.delete(n);
      b.classList.toggle("on", on);
      b.setAttribute("aria-pressed", String(on));
      render();
    });
    agencyChipsEl.append(b);
  });
}

function renderStats(){
  const by = { RULE: 0, PRORULE: 0, NOTICE: 0, PRESDOCS: 0, OTHER: 0 };
  state.docs.forEach(function(d){ by[typeInfo(d.type).code]++; });
  statsEl.textContent = "";
  function mk(n, l){
    const w = document.createElement("div"); w.className = "stat";
    const b = document.createElement("b"); b.textContent = n;
    const s = document.createElement("span"); s.textContent = l;
    w.append(b, s); return w;
  }
  statsEl.append(
    mk(state.docs.length, "documents"),
    mk(by.RULE, "rules"),
    mk(by.PRORULE, "proposed"),
    mk(by.NOTICE, "notices"),
    mk(by.PRESDOCS, "presidential")
  );
}

function renderTypePills(){
  const defs = [["ALL","All types"],["RULE","Rules"],["PRORULE","Proposed"],["NOTICE","Notices"],["PRESDOCS","Presidential"]];
  typePillsEl.textContent = "";
  defs.forEach(function(d){
    const b = document.createElement("button");
    b.className = "pill" + (state.type === d[0] ? " on" : "");
    b.setAttribute("aria-pressed", String(state.type === d[0]));
    b.textContent = d[1];
    b.addEventListener("click", function(){ state.type = d[0]; renderTypePills(); render(); });
    typePillsEl.append(b);
  });
}

function render(){
  listEl.textContent = "";
  let docs = state.docs.slice();
  if (state.type !== "ALL") docs = docs.filter(function(d){ return typeInfo(d.type).code === state.type; });
  if (state.agencies.size) docs = docs.filter(function(d){
    return agencyNamesOf(d).some(function(n){ return state.agencies.has(n); });
  });
  if (!state.docs.length){
    msgCard("Nothing published", "The Federal Register lists no documents for " + state.date +
      ". It publishes on business days — try a recent weekday.");
    return;
  }
  if (!docs.length){
    const c = document.createElement("div"); c.className = "card-msg";
    const p = document.createElement("p"); p.textContent = "No documents match the current filters.";
    c.append(p); listEl.append(c); return;
  }
  docs.forEach(function(d){
    const ti = typeInfo(d.type);
    const card = document.createElement("article"); card.className = "doc";
    const badge = document.createElement("span"); badge.className = "badge " + ti.cls; badge.textContent = ti.label;
    const h = document.createElement("h3");
    const a = document.createElement("a");
    a.href = d.html_url || "#"; a.target = "_blank"; a.rel = "noopener";
    a.textContent = d.title || "(untitled document)";
    h.append(a);
    card.append(badge, h);
    const ags = agencyNamesOf(d);
    if (ags.length){ const ae = document.createElement("div"); ae.className = "agencies"; ae.textContent = ags.join(" · "); card.append(ae); }
    if (d.abstract){ const ab = document.createElement("div"); ab.className = "abstract"; ab.textContent = d.abstract; card.append(ab); }
    listEl.append(card);
  });
}

/* ---- init ---- */
dateInput.value = todayISO();
dateInput.max = todayISO();
dateInput.addEventListener("change", function(){ if (dateInput.value){ state.type = "ALL"; load(dateInput.value); } });
load(todayISO());
</script>
