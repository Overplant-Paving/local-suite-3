/* Safe storage backend: memory fallback when localStorage is unavailable
   (private mode, file:// quirks). Persistence is polite, never fatal. */
const backend = (() => {
  try {
    const k = "__suite_t";
    localStorage.setItem(k, "1");
    localStorage.removeItem(k);
    return localStorage;
  } catch (e) {
    const mem = new Map();
    return {
      getItem: k => (mem.has(k) ? mem.get(k) : null),
      setItem: (k, v) => { mem.set(k, String(v)); },
      removeItem: k => { mem.delete(k); }

function assertNamespaced(key) {
  if (typeof key !== "string" || !key.startsWith("suite.")) {
    throw new Error('Suite.store keys must start with "suite." - got: ' + key);

  /* v1 wrote some keys as bare strings ("dark", "F") and some as JSON.
     Read both: JSON first, raw string when parsing fails. */
  get(key, fallback = null) {
    assertNamespaced(key);

    try { return JSON.parse(raw); } catch (e) { return raw; }

  /* Strings are written bare so v1 tools keep reading their keys unchanged. */
  set(key, value) {
    assertNamespaced(key);
    try {
      backend.setItem(key, typeof value === "string" ? value : JSON.stringify(value));
    } catch (e) { /* quota exceeded or denied - never fatal */ }
  },
  /* Deletes a key outright (v1 tools used removeItem for unpin/clear flows). */
  remove(key) {
    assertNamespaced(key);
    try { backend.removeItem(key); } catch (e) {}
  },

/* ---- fetch: one helper for the whole suite ----

async function fetchJSON(url, opts = {}) {

    timeout = 12000, cacheKey = null, ttl = 0, fallbackToCache = true,
    accept = "application/json", tries = 1, headers = {}

    return { v: cached.v, t: cached.t, stale: false, fromCache: true };

  let lastErr = null;
  const n = Math.max(1, tries);
  for (let i = 0; i < n; i++) {
    const ctrl = new AbortController();

      const r = await fetch(url, {
        signal: ctrl.signal,
        headers: Object.assign(accept ? { "Accept": accept } : {}, headers)

        const v = await r.json();
        const t = Date.now();

      lastErr = new Error("HTTP " + r.status);
      if (r.status === 404) break; /* a 404 will not improve on retry */

      clearTimeout(timer);
      lastErr = (e && e.name === "AbortError") ? new Error("timed out") : e;

    return { v: cached.v, t: cached.t, stale: true, fromCache: true };

  throw lastErr || new Error("fetch failed");

/* GOES-19 sectors (code, label). CONUS + full disk + regional. */
const SECTORS = [
  ["CONUS", "Continental US"],
  ["ne", "Northeast"],
  ["se", "Southeast"],
  ["umv", "Upper Mississippi Valley"],
  ["cgl", "Great Lakes"],
  ["sp", "Southern Plains"],
  ["sr", "Southern Rockies"],
  ["nr", "Northern Rockies"],
  ["pnw", "Pacific Northwest"],
  ["psw", "Pacific Southwest"],
  ["pr", "Puerto Rico"],
  ["FD", "Full Disk (whole hemisphere)"]
];
const PRODUCTS = [
  ["GEOCOLOR", "GeoColor (true-ish color)"],
  ["13", "Clean infrared (13)"],
  ["AirMass", "Air mass"],
  ["Sandwich", "Sandwich (IR + visible)"]
];

function haversine(a, b, c, d) {
  const R = 6371, r = Math.PI/180;
  const dLat = (c-a)*r, dLon = (d-b)*r;
  const s = Math.sin(dLat/2)**2 + Math.cos(a*r)*Math.cos(c*r)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
function nearestStation(lat, lon) {
  let best = null, bestD = Infinity;
  for (const s of STATIONS) {
    const dkm = haversine(lat, lon, s[1], s[2]);
    if (dkm < bestD) { bestD = dkm; best = s; }
  }
  return { s: best, km: bestD };
}

/* ---------- state ---------- */
let view = "radar";

/* v1 wrote these keys as bare strings. Suite.store.get JSON-parses when it can,
   so the product code "13" (clean infrared) would come back as the number 13 —
   normalize every read through String(). Writes stay bare strings (byte-identical). */
function getPref(key, d) {
  const v = Suite.store.get(key, d);
  return v == null ? d : String(v);
}

/* ---------- RADAR view ---------- */
function renderRadar() {
  const loc = getLocation();
  let saved = getPref("suite.radar.station", "");
  if (!saved && loc) saved = nearestStation(loc.lat, loc.lon).s[0];
  if (!saved) saved = "KLWX";

  const opts = STATIONS.map(s => {
    const dist = loc ? " · " + Math.round(haversine(loc.lat, loc.lon, s[1], s[2])) + " km" : "";
    return `<option value="${s[0]}"${s[0]===saved?" selected":""}>${s[0]} — ${s[3]}${dist}</option>`;
  }).join("");
  const near = loc ? nearestStation(loc.lat, loc.lon) : null;

  mainEl.innerHTML =
    `<div class="panel">
      <div class="ctrls">
        <label class="fld">Radar station
          <select id="stnSel">${opts}</select>
        </label>
        <button class="btn ghost sm" id="refreshR" style="align-self:flex-end">↻ Refresh</button>
        ${near ? `<span class="hint" style="align-self:flex-end">Nearest to ${esc(loc.label)}: <strong>${near.s[0]}</strong> (${Math.round(near.km)} km)</span>` : ""}
      </div>
      <div class="imgwrap" id="rWrap"><span class="load">Loading radar loop…</span></div>
      <div class="capt">
        <span class="stn" id="rCapt">—</span>
        <span id="rTime"></span>
      </div>
    </div>`;

  const sel = $("#stnSel");
  function show(id) {
    Suite.store.set("suite.radar.station", id);
    const s = STATIONS.find(x => x[0] === id) || STATIONS[0];
    const wrap = $("#rWrap");
    wrap.innerHTML = `<span class="load">Loading ${esc(id)} loop…</span>`;
    const url = `https://radar.weather.gov/ridge/standard/${id}_loop.gif?t=${Date.now()}`;
    const img = new Image();
    img.alt = `Radar loop for ${s[3]} (${id})`;
    img.addEventListener("load", () => { wrap.innerHTML = ""; wrap.appendChild(img); });
    img.addEventListener("error", () => { wrap.innerHTML = `<div class="err">Couldn't load the ${esc(id)} radar loop. Try another station or refresh.</div>`; });
    img.src = url;
    $("#rCapt").textContent = `${s[3]} · ${id}`;
    $("#rTime").textContent = "animated ~1-hour loop · loaded " + new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
  }
  sel.addEventListener("change", () => show(sel.value));
  $("#refreshR").addEventListener("click", () => show(sel.value));
  show(saved);
}

/* ---------- SATELLITE view ---------- */
function renderSat() {
  const savedSec = getPref("suite.radar.sector", "CONUS");
  const savedProd = getPref("suite.radar.product", "GEOCOLOR");
  const secOpts = SECTORS.map(s => `<option value="${s[0]}"${s[0]===savedSec?" selected":""}>${s[1]}</option>`).join("");
  const prodOpts = PRODUCTS.map(p => `<option value="${p[0]}"${p[0]===savedProd?" selected":""}>${p[1]}</option>`).join("");

  mainEl.innerHTML =
    `<div class="panel">
      <div class="ctrls">
        <label class="fld">Region
          <select id="secSel">${secOpts}</select>
        </label>
        <label class="fld">Imagery
          <select id="prodSel">${prodOpts}</select>
        </label>
        <button class="btn ghost sm" id="refreshS" style="align-self:flex-end">↻ Refresh</button>
      </div>
      <div class="imgwrap" id="sWrap"><span class="load">Loading satellite imagery…</span></div>
      <div class="capt">
        <span class="stn" id="sCapt">—</span>
        <span id="sTime"></span>
      </div>
      <div class="hint">GOES-19 imagery updates roughly every 5–10 minutes. Full-disk and CONUS images are large; regional sectors load fastest.</div>
    </div>`;

  function sizeFor(sec) {
    if (sec === "CONUS") return "1250x750.jpg";
    if (sec === "FD") return "1808x1808.jpg";
    return "1200x1200.jpg";
  }
  function pathFor(sec, prod) {
    const size = sizeFor(sec);
    if (sec === "CONUS" || sec === "FD")
      return `https://cdn.star.nesdis.noaa.gov/GOES19/ABI/${sec}/${prod}/${size}`;
    return `https://cdn.star.nesdis.noaa.gov/GOES19/ABI/SECTOR/${sec}/${prod}/${size}`;
  }
  function show() {
    const sec = $("#secSel").value, prod = $("#prodSel").value;
    Suite.store.set("suite.radar.sector", sec); Suite.store.set("suite.radar.product", prod);
    const wrap = $("#sWrap");
    wrap.innerHTML = `<span class="load">Loading imagery…</span>`;
    const secLbl = (SECTORS.find(s => s[0] === sec) || [])[1] || sec;
    const prodLbl = (PRODUCTS.find(p => p[0] === prod) || [])[1] || prod;
    const url = pathFor(sec, prod) + "?t=" + Date.now();
    const img = new Image();
    img.alt = `GOES-19 ${prodLbl} imagery of ${secLbl}`;
    img.addEventListener("load", () => { wrap.innerHTML = ""; wrap.appendChild(img); });
    img.addEventListener("error", () => { wrap.innerHTML = `<div class="err">That imagery combination isn't available right now. Try another region or product.</div>`; });
    img.src = url;
    $("#sCapt").textContent = `${secLbl} · ${prodLbl}`;
    $("#sTime").textContent = "latest available · loaded " + new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
  }
  $("#secSel").addEventListener("change", show);
  $("#prodSel").addEventListener("change", show);
  $("#refreshS").addEventListener("click", show);
  show();
}

/* ---------- first run ---------- */
function renderFirstRun(msg) {
  locLabelEl.textContent = "not set";
  mainEl.innerHTML =
    `<div class="panel"><div class="card-msg">
      <div class="big">Set your location</div>
      Radar auto-suggests the nearest NWS station once it knows where you are. (Satellite works without it.)
      ${msg ? `<div class="notice" style="color:#c0392b">${esc(msg)}</div>` : ""}
      <div class="field"><label for="zip">US ZIP code</label>
        <input id="zip" inputmode="numeric" placeholder="e.g. 10001" maxlength="5"></div>
      <div class="row" style="justify-content:center">
        <button class="btn" id="zipGo">Set location</button>
        <button class="btn ghost" id="geoGo">Use my location</button>
        <button class="btn ghost" id="skipGo">Skip — just satellite</button>
      </div>
      <div class="notice" id="locMsg"></div>
    </div></div>`;
  const zip = $("#zip"), locMsg = Suite.liveRegion($("#locMsg"));
  zip.focus();
  zip.addEventListener("keydown", e => { if (e.key === "Enter") $("#zipGo").click(); });
  $("#zipGo").addEventListener("click", async () => {
    const z = (zip.value || "").trim();
    if (!/^\d{5}$/.test(z)) { locMsg.textContent = "Enter a 5-digit ZIP code."; return; }
    locMsg.textContent = "Looking up…";
    try {
      const r = await Suite.fetchJSON(`https://api.zippopotam.us/us/${z}`, { accept: "application/json" });
      const place = r.v.places && r.v.places[0];
      if (!place) throw new Error("ZIP not found");
      saveLocation({ lat: parseFloat(place.latitude), lon: parseFloat(place.longitude),
        label: `${place["place name"]}, ${place["state abbreviation"]} ${z}` });
      boot();
    } catch(e) { locMsg.textContent = "Couldn't find that ZIP (" + (e.message || e) + ")."; }
  });
  $("#geoGo").addEventListener("click", () => {
    if (!navigator.geolocation) { locMsg.textContent = "Geolocation isn't available here."; return; }
    locMsg.textContent = "Requesting location…";
    navigator.geolocation.getCurrentPosition(
      pos => { saveLocation({ lat: +pos.coords.latitude.toFixed(4), lon: +pos.coords.longitude.toFixed(4),
        label: `My location (${pos.coords.latitude.toFixed(3)}, ${pos.coords.longitude.toFixed(3)})` }); boot(); },
      err => { locMsg.textContent = "Couldn't get location: " + err.message; });
  });
  $("#skipGo").addEventListener("click", () => { view = "sat"; setTab(); renderSat(); });
}

/* ---------- tabs ---------- */
function setTab() {
  $("#tabRadar").classList.toggle("on", view === "radar");
  $("#tabSat").classList.toggle("on", view === "sat");
  $("#tabRadar").setAttribute("aria-pressed", String(view === "radar"));
  $("#tabSat").setAttribute("aria-pressed", String(view === "sat"));
}
$("#tabRadar").addEventListener("click", () => { view = "radar"; setTab(); boot(); });
$("#tabSat").addEventListener("click", () => { view = "sat"; setTab(); renderSat(); });
$("#changeLoc").addEventListener("click", () => renderFirstRun());

/* ---------- boot ---------- */
function boot() {
  const loc = getLocation();
  locLabelEl.textContent = loc ? loc.label : "not set";
  setTab();
  if (view === "sat") { renderSat(); return; }
  if (!loc) { renderFirstRun(); return; }
  renderRadar();
}
boot();
</script>
