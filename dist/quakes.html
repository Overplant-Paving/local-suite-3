/* Local Suite v2 — core/suite.js
   One IIFE, one global. Small, boring, dependency-free. Spec: ARCHITECTURE.md §3.

   Not here yet (no dead API surface ships):
   - Protocol-gated service-worker registration lands in Phase 3 (PWA.md). */
(() => {
"use strict";

/* Safe storage backend: memory fallback when localStorage is unavailable
   (private mode, file:// quirks). Persistence is polite, never fatal. */
const backend = (() => {
  try {
    const k = "__suite_t";
    localStorage.setItem(k, "1");
    localStorage.removeItem(k);
    return localStorage;
  } catch (e) {
    const mem = new Map();
    return {
      getItem: k => (mem.has(k) ? mem.get(k) : null),
      setItem: (k, v) => { mem.set(k, String(v)); },
      removeItem: k => { mem.delete(k); }
    };
  }
})();

function assertNamespaced(key) {
  if (typeof key !== "string" || !key.startsWith("suite.")) {
    throw new Error('Suite.store keys must start with "suite." - got: ' + key);
  }
}

const store = {
  /* v1 wrote some keys as bare strings ("dark", "F") and some as JSON.
     Read both: JSON first, raw string when parsing fails. */
  get(key, fallback = null) {
    assertNamespaced(key);
    const raw = backend.getItem(key);
    if (raw === null) return fallback === undefined ? null : fallback;
    try { return JSON.parse(raw); } catch (e) { return raw; }
  },
  /* Strings are written bare so v1 tools keep reading their keys unchanged. */
  set(key, value) {
    assertNamespaced(key);
    try {
      backend.setItem(key, typeof value === "string" ? value : JSON.stringify(value));
    } catch (e) { /* quota exceeded or denied - never fatal */ }
  },
  /* Deletes a key outright (v1 tools used removeItem for unpin/clear flows). */
  remove(key) {
    assertNamespaced(key);
    try { backend.removeItem(key); } catch (e) {}
  },
  /* Ordered migrations gated by suite.meta.schemaVersion (ARCHITECTURE.md §6).
     Baseline v2 = v1 layout, so the suite-wide list starts empty. */
  migrate(fns) {
    const KEY = "suite.meta.schemaVersion";
    let v = store.get(KEY, 0);
    if (typeof v !== "number" || !isFinite(v)) v = 0;
    for (; v < fns.length; v++) fns[v]();
    store.set(KEY, fns.length);
  }
};

/* ---- theme: the suite.theme convention (absent = follow system) ---- */
function activeTheme() {
  return document.documentElement.dataset.theme ||
    (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
}
function paintThemeButtons() {
  document.querySelectorAll("#themeBtn, .theme-btn").forEach(btn => {
    btn.setAttribute("aria-pressed", String(activeTheme() === "dark"));
  });
}
const theme = {
  init() {
    const saved = store.get("suite.theme");
    if (saved === "light" || saved === "dark") {
      document.documentElement.dataset.theme = saved;
    }
    document.querySelectorAll("#themeBtn, .theme-btn").forEach(btn => {
      btn.setAttribute("aria-label", "Toggle light/dark theme");
      btn.addEventListener("click", theme.toggle);
    });
    paintThemeButtons();
  },
  toggle() {
    const next = activeTheme() === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    store.set("suite.theme", next);
    paintThemeButtons();
  }
};

/* ---- fetch: one helper for the whole suite ----
   Returns an envelope {v, t, stale, fromCache}:
     v         the JSON payload
     t         epoch ms the payload was fetched
     stale     true when the network failed and this is the cached fallback -
               render the "Offline - cached from <time>" card
     fromCache true when no request was made (fresh within ttl, or stale)
   Cache lives at localStorage["suite.cache." + cacheKey] as {t, v}
   (the v1 envelope - v1 caches keep working). ttl is in ms; 0 = always fetch. */
async function fetchJSON(url, opts = {}) {
  const {
    timeout = 12000, cacheKey = null, ttl = 0, fallbackToCache = true,
    accept = "application/json", tries = 1, headers = {}
  } = opts;
  const fullKey = cacheKey ? "suite.cache." + cacheKey : null;

  let cached = null;
  if (fullKey) {
    const e = store.get(fullKey);
    if (e && typeof e === "object" && "t" in e && "v" in e) cached = e;
  }
  if (cached && ttl > 0 && Date.now() - cached.t < ttl) {
    return { v: cached.v, t: cached.t, stale: false, fromCache: true };
  }

  let lastErr = null;
  const n = Math.max(1, tries);
  for (let i = 0; i < n; i++) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeout);
    try {
      const r = await fetch(url, {
        signal: ctrl.signal,
        headers: Object.assign(accept ? { "Accept": accept } : {}, headers)
      });
      clearTimeout(timer);
      if (r.ok) {
        const v = await r.json();
        const t = Date.now();
        if (fullKey) store.set(fullKey, { t, v });
        return { v, t, stale: false, fromCache: false };
      }
      lastErr = new Error("HTTP " + r.status);
      if (r.status === 404) break; /* a 404 will not improve on retry */
    } catch (e) {
      clearTimeout(timer);
      lastErr = (e && e.name === "AbortError") ? new Error("timed out") : e;
    }
    if (i < n - 1) await new Promise(res => setTimeout(res, 600 * (i + 1)));
  }
  if (fallbackToCache && cached) {
    return { v: cached.v, t: cached.t, stale: true, fromCache: true };
  }
  throw lastErr || new Error("fetch failed");
}

/* ---- escaping: mandatory for remote data interpolated into innerHTML ---- */
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ---- a11y: mark an async result container so screen readers hear updates ---- */
function liveRegion(el) {
  el.setAttribute("aria-live", "polite");
  return el;
}

/* ---- shared location: the suite.location key, used by ~20 tools ---- */
const loc = {
  get() {
    const l = store.get("suite.location");
    if (l && typeof l === "object" && isFinite(l.lat) && isFinite(l.lon)) {
      return { lat: +l.lat, lon: +l.lon, label: l.label || "" };
    }
    return null;
  },
  set(l) {
    if (!l || !isFinite(l.lat) || !isFinite(l.lon)) {
      throw new Error("Suite.location.set needs {lat, lon}");
    }
    store.set("suite.location", { lat: +l.lat, lon: +l.lon, label: l.label || "" });
  }
};

/* ---- API keys: the suite.key.<name> convention (API-AND-RELAY.md §3) ----
   Officially published demo/public keys only — never a personal key. */
const DEMO_KEYS = {
  nasa: "DEMO_KEY",              // api.nasa.gov demo tier: 30/hr, 50/day
  usda: "DEMO_KEY",              // USDA FoodData Central demo tier
  bart: "MW9S-E7SL-26DU-VV8V"    // BART's officially published public key
};
function key(name) {
  const v = store.get("suite.key." + name);
  if (typeof v === "string" && v.trim()) return { value: v.trim(), isDemo: false };
  if (DEMO_KEYS[name]) return { value: DEMO_KEYS[name], isDemo: true };
  return { value: null, isDemo: false };
}

/* ---- optional power-user relay (API-AND-RELAY.md §6) ----
   Unset for everyone by default: tools use their link-out/embedded paths. */
function relay(url) {
  const base = store.get("suite.relay.url");
  if (typeof base !== "string" || !base.trim()) return null;
  const b = base.trim().replace(/\/$/, "");
  return b + (b.includes("?") ? "&" : "?") + "url=" + encodeURIComponent(url);
}

window.Suite = { theme, fetchJSON, store, esc, liveRegion, location: loc, key, relay };

/* ---- PWA registration (PWA.md §1) — inert from file://, forever ----
   The .catch keeps a failed registration from ever costing console noise on a
   page that works perfectly well without the service worker. */
if (location.protocol.startsWith("http") && "serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
})();

<script>
"use strict";

Suite.theme.init();

/* ---------- shared suite helpers ---------- */
const esc = Suite.esc;
function getLoc(){ return Suite.location.get(); }

function haversineKm(lat1,lon1,lat2,lon2){
  const R=6371,r=Math.PI/180;
  const dLa=(lat2-lat1)*r, dLo=(lon2-lon1)*r;
  const s=Math.sin(dLa/2)**2+Math.cos(lat1*r)*Math.cos(lat2*r)*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
function relTime(ms){
  const d=Math.round((Date.now()-ms)/1000);
  if(d<60) return d+"s ago";
  if(d<3600) return Math.round(d/60)+"m ago";
  if(d<86400) return Math.round(d/3600)+"h ago";
  return Math.round(d/86400)+"d ago";
}

/* ---------- magnitude color scale (USGS-ish) ---------- */
function magColor(m){
  if(m==null) return "#9aa0a8";
  if(m<2.5) return "#6a9e57";
  if(m<4)   return "#c9a227";
  if(m<5)   return "#e08a2e";
  if(m<6)   return "#d9622b";
  if(m<7)   return "#c23b3b";
  return "#8f2d6b";
}

    try{
      const d=(await Suite.fetchJSON(`https://api.zippopotam.us/us/${z}`)).v;
      const p=d.places[0];
      setLoc({lat:parseFloat(p.latitude),lon:parseFloat(p.longitude),label:`${p["place name"]}, ${p["state abbreviation"]}`});
      boot();
    }catch(e){ err.textContent="Couldn't find that ZIP. Try another."; }
  });
  zip.addEventListener("keydown",e=>{ if(e.key==="Enter") document.getElementById("zipBtn").click(); });
  document.getElementById("geoBtn").addEventListener("click", ()=>{
    if(!navigator.geolocation){ err.textContent="Geolocation isn't available here."; return; }
    err.textContent="Locating…";
    navigator.geolocation.getCurrentPosition(
      pos=>{ setLoc({lat:+pos.coords.latitude.toFixed(4),lon:+pos.coords.longitude.toFixed(4),label:"My location"}); boot(); },
      e=>{ err.textContent="Location denied. Try a ZIP instead (may need http://)."; }
    );
  });
}

/* ---------- main dashboard shell ---------- */
function renderShell(){
  const loc=getLoc();
  const feedOpts=Object.entries(FEEDS).map(([k,v])=>`<option value="${k}"${k===state.feed?" selected":""}>${v.label}</option>`).join("");
  appEl.innerHTML=`
    <div class="locbar">
      <span>Centered on <b id="locLabel"></b></span>
      <button class="linkbtn" id="changeLoc">change</button>
    </div>
    <div class="controls card">
      <div class="ctl">
        <label for="feedSel">Feed</label>
        <select id="feedSel">${feedOpts}</select>
      </div>
      <div class="ctl">
        <label for="minMag">Min magnitude · <span class="val" id="minMagVal"></span></label>
        <input type="range" id="minMag" min="0" max="7" step="0.5" value="${state.minMag}">
      </div>
      <div class="ctl">
        <label for="maxDist">Within · <span class="val" id="maxDistVal"></span></label>
        <input type="range" id="maxDist" min="250" max="20000" step="250" value="${state.maxDist}">
      </div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="card mapcard" id="mapCard"></div>
    <div id="stamp" class="stamp"></div>
    <div class="list" id="list"></div>`;

  document.getElementById("locLabel").textContent=loc?loc.label:"—";
  document.getElementById("changeLoc").addEventListener("click", renderSetup);
  document.getElementById("minMagVal").textContent="M"+state.minMag.toFixed(1);
  document.getElementById("maxDistVal").textContent=distLabel(state.maxDist);
  Suite.liveRegion(document.getElementById("stats"));
  Suite.liveRegion(document.getElementById("stamp"));

  const feedSel=document.getElementById("feedSel");
  feedSel.addEventListener("change", ()=>{ state.feed=feedSel.value; Suite.store.set("suite.quakes.feed",state.feed); load(); });
  const minMag=document.getElementById("minMag");
  minMag.addEventListener("input", ()=>{ state.minMag=parseFloat(minMag.value); Suite.store.set("suite.quakes.minMag",state.minMag);
    document.getElementById("minMagVal").textContent="M"+state.minMag.toFixed(1); renderData(); });
  const maxDist=document.getElementById("maxDist");
  maxDist.addEventListener("input", ()=>{ state.maxDist=parseFloat(maxDist.value); Suite.store.set("suite.quakes.maxDist",state.maxDist);
    document.getElementById("maxDistVal").textContent=distLabel(state.maxDist); renderData(); });
}
function distLabel(km){ return km>=20000?"anywhere":`${Math.round(km)} km`; }

/* ---------- seen-quake tracking for new-quake highlight ---------- */
function seenSet(){ try{ return new Set(Suite.store.get("suite.quakes.seen", [])); }catch(e){ return new Set(); } }
function saveSeen(ids){ Suite.store.set("suite.quakes.seen", ids.slice(0,600)); }

/* ---------- data load ---------- */
async function load(){
  const key=state.feed;
  // instant paint from the cache envelope while the (possible) network fetch runs — v1 behavior
  const cached=Suite.store.get("suite.cache.quakes."+key);
  if(cached && typeof cached==="object" && "v" in cached){
    state.data=cached.v; state.stamp=cached.t; state.error=null; renderData();
  }
  try{
    const r=await Suite.fetchJSON(FEEDS[state.feed].url, {cacheKey:"quakes."+key, ttl:TTL});
    state.data=r.v; state.stamp=r.t;
    state.error=r.stale ? "offline — showing cached data" : null;
    renderData();
  }catch(e){
    state.error=e.message||String(e);
    if(!state.data) renderData(); else renderStamp();
  }
}

/* ---------- render data ---------- */
let firstRenderDone=false;
function renderData(){
  const loc=getLoc();
  const listEl=document.getElementById("list");
  if(!listEl) return;
  renderStamp();

  if(!state.data){
    document.getElementById("mapCard").innerHTML="";
    listEl.innerHTML=`<div class="card msg"><div class="big">Couldn't reach USGS</div>
      No cached quakes to show yet. Check your connection; the monitor will retry automatically.</div>`;
    document.getElementById("stats").innerHTML="";
    return;
  }

  const seen=seenSet();
  let feats=(state.data.features||[]).map(f=>{
    const p=f.properties, g=f.geometry&&f.geometry.coordinates||[];
    const lon=g[0], lat=g[1], depth=g[2];
    const dist=(loc&&isFinite(lat)&&isFinite(lon))?haversineKm(loc.lat,loc.lon,lat,lon):null;
    return {id:f.id, mag:p.mag, place:p.place, time:p.time, url:p.url, tsunami:p.tsunami,
            lat,lon,depth,dist, isNew:!seen.has(f.id)};
  });

  // filter
  let shown=feats.filter(q=>(q.mag==null||q.mag>=state.minMag) &&
    (state.maxDist>=20000 || q.dist==null || q.dist<=state.maxDist));
  // sort by time desc
  shown.sort((a,b)=>b.time-a.time);

  // stats
  const largest=shown.reduce((m,q)=>(q.mag!=null&&q.mag>m)?q.mag:m,-Infinity);
  const newCount=firstRenderDone?shown.filter(q=>q.isNew).length:0;
  document.getElementById("stats").innerHTML=`
    <div class="stat"><b>${shown.length}</b><span>shown</span></div>
    <div class="stat"><b>${largest>-Infinity?"M"+largest.toFixed(1):"—"}</b><span>largest</span></div>
    <div class="stat"><b>${loc&&shown.length&&shown.some(q=>q.dist!=null)?Math.round(Math.min(...shown.filter(q=>q.dist!=null).map(q=>q.dist)))+" km":"—"}</b><span>nearest</span></div>
    ${firstRenderDone?`<div class="stat"><b>${newCount}</b><span>new</span></div>`:""}`;

  drawMap(shown, loc);
  renderList(shown, listEl);

  // record seen for next refresh (all feature ids, not just filtered)
  saveSeen(feats.map(q=>q.id));
  firstRenderDone=true;
}

function renderStamp(){
  const el=document.getElementById("stamp");
  if(!el) return;
  let s="";
  if(state.stamp){
    const age=Date.now()-state.stamp;
    const fresh=age<6*60*1000;
    s=`Data from ${new Date(state.stamp).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})}` +
      (fresh?"":" · showing cached, retrying");
  }
  if(state.error){ el.className="stamp err"; el.textContent=(s?s+" · ":"")+"connection issue: "+state.error; }
  else { el.className="stamp"; el.textContent=s; }
}

/* ---------- equirectangular SVG map ---------- */
function drawMap(quakes, loc){
  const W=980, H=490;
  const px=lon=>(lon+180)/360*W;
  const py=lat=>(90-lat)/180*H;
  let g="";
  // graticule every 30°
  for(let lon=-180;lon<=180;lon+=30){ const x=px(lon).toFixed(1); g+=`<line class="grat" x1="${x}" y1="0" x2="${x}" y2="${H}"/>`; }
  for(let lat=-90;lat<=90;lat+=30){ const y=py(lat).toFixed(1); const cls=lat===0?"grat eq":"grat"; g+=`<line class="${cls}" x1="0" y1="${y}" x2="${W}" y2="${y}"/>`; }
  // equator + prime meridian labels
  g+=`<text x="4" y="${(py(0)-4).toFixed(1)}" font-size="9" fill="var(--muted)">Equator</text>`;

  // quake dots — smaller first so big ones sit on top
  const sorted=[...quakes].sort((a,b)=>(a.mag||0)-(b.mag||0));
  let dots="";
  for(const q of sorted){
    if(!isFinite(q.lat)||!isFinite(q.lon)) continue;
    const r=Math.max(1.6, q.mag!=null? (q.mag*q.mag)/7+1.6 : 1.6);
    const op=q.isNew&&firstRenderDone?1:0.82;
    dots+=`<circle class="qdot" cx="${px(q.lon).toFixed(1)}" cy="${py(q.lat).toFixed(1)}" r="${r.toFixed(1)}" fill="${magColor(q.mag)}" fill-opacity="${op}">`+
          `<title>M${q.mag!=null?q.mag.toFixed(1):"?"} — ${esc(q.place)}</title></circle>`;
  }
  let home="";
  if(loc){
    const hx=px(loc.lon).toFixed(1), hy=py(loc.lat).toFixed(1);
    home=`<g><line class="home" x1="${hx-6}" y1="${hy}" x2="${hx+6}" y2="${hy}"/>`+
         `<line class="home" x1="${hx}" y1="${hy-6}" x2="${hx}" y2="${hy+6}"/>`+
         `<circle class="home" cx="${hx}" cy="${hy}" r="7"/></g>`;
  }
  const legend=[["<2.5","#6a9e57"],["2.5–4","#c9a227"],["4–5","#e08a2e"],["5–6","#d9622b"],["6–7","#c23b3b"],["7+","#8f2d6b"]]
    .map(([l,c])=>`<span><span class="sw" style="background:${c}"></span>${l}</span>`).join("");

  document.getElementById("mapCard").innerHTML=
    `<svg class="map" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="World map of recent earthquakes">`+
      g+dots+home+`</svg>`+
    `<div class="legend">${legend}<span style="margin-left:auto">dot size ∝ magnitude · ✛ you</span></div>`;
}

/* ---------- list ---------- */
function renderList(quakes, listEl){
  if(!quakes.length){
    listEl.innerHTML=`<div class="card msg"><div class="big">No quakes match</div>
      Nothing in this feed passes your magnitude and distance filters. Widen them, or pick a broader feed.</div>`;
    return;
  }
  const loc=getLoc();
  listEl.innerHTML=quakes.slice(0,250).map(q=>{
    const col=magColor(q.mag);
    const magTxt=q.mag!=null?q.mag.toFixed(1):"?";
    const depthTxt=isFinite(q.depth)?`${Math.round(q.depth)} km deep`:"";
    const distTxt=(q.dist!=null)?`${Math.round(q.dist).toLocaleString()} km away`:"";
    const meta=[depthTxt,distTxt].filter(Boolean).join(" · ");
    const tsu=q.tsunami?` · <span style="color:var(--tsu)">tsunami</span>`:"";
    const isNew=q.isNew&&firstRenderDone;
    return `<div class="q${isNew?" new":""}">
      <div class="badge" style="background:${col};color:${magInk(q.mag)}"><small>M</small>${magTxt}</div>
      <div>
        <div class="place">${q.url?`<a href="${esc(q.url)}" target="_blank" rel="noopener">${esc(q.place)||"Unknown location"}</a>`:esc(q.place)||"Unknown location"}${isNew?`<span class="newtag">NEW</span>`:""}</div>
        <div class="meta">${meta}${tsu}</div>
      </div>
      <div class="right"><b>${relTime(q.time)}</b>${new Date(q.time).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})}</div>
    </div>`;
  }).join("");
}

/* ---------- boot ---------- */
function boot(){
  if(!getLoc()){ renderSetup(); return; }
  renderShell();
  load();
  clearInterval(refreshTimer);
  refreshTimer=setInterval(load, 5*60*1000);
}
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && getLoc()) load(); });
boot();
</script>
