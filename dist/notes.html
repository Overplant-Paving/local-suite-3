/* ---- fetch: one helper for the whole suite ----

    accept = "application/json", tries = 1, headers = {}

     flight. Never render or cache a response whose location context changed. */
  const locationAtStart = JSON.stringify(store.get("suite.location"));

  let cached = null;
  if (fullKey) {
    const e = store.get(fullKey);
    if (e && typeof e === "object" && "t" in e && "v" in e) cached = e;
  }

    return { v: cached.v, t: cached.t, stale: false, fromCache: true };
  }

  let lastErr = null;

  for (let i = 0; i < n; i++) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeout);
    try {
      const r = await fetch(url, {
        signal: ctrl.signal,
        headers: Object.assign(accept ? { "Accept": accept } : {}, headers)
      });
      clearTimeout(timer);

        const v = await r.json();
        if (JSON.stringify(store.get("suite.location")) !== locationAtStart) {
          const changed = new Error("active location changed during request");
          changed.locationChanged = true;
          throw changed;
        }
        const t = Date.now();
        if (fullKey) store.set(fullKey, { t, v });
        return { v, t, stale: false, fromCache: false };

      lastErr = new Error("HTTP " + r.status);
      if (r.status === 404) break; /* a 404 will not improve on retry */
    } catch (e) {
      clearTimeout(timer);
      if (e && e.locationChanged) throw e;
      lastErr = (e && e.name === "AbortError") ? new Error("timed out") : e;
    }
    if (i < n - 1) await new Promise(res => setTimeout(res, 600 * (i + 1)));
  }

    if (JSON.stringify(store.get("suite.location")) !== locationAtStart) {
      throw new Error("active location changed during request");
    }
    return { v: cached.v, t: cached.t, stale: true, fromCache: true };
  }

  return l && typeof l === "object" && isFinite(l.lat) && isFinite(l.lon) &&
    Math.abs(+l.lat) <= 90 && Math.abs(+l.lon) <= 180;

  "suite.state", "suite.alerts.seen"

  if (raw.schema !== undefined && raw.schema !== LOCATIONS_SCHEMA) {

  }
};

const locations = {
  /* Migration is explicit: only v3 entry points (hub/settings) call init().
     Older tools that merely read suite.location do not gain a surprise key. */
  init() {
    let c = readLocations();
    if (c && (c.unsupported || c.invalid)) return c;
    if (c && c.items.length) {
      const item = activeItem(c);
      if (item) mirrorLocation(item);
      return c;
    }
    if (c) store.remove(LOCATIONS_KEY);
    const legacy = loc.get();
    if (!legacy) return { schema: LOCATIONS_SCHEMA, activeId: null, items: [] };
    const item = Object.assign({ id: "saved-location", revision: 1 }, legacy);
    item.label = legacy.label;
    c = { schema: LOCATIONS_SCHEMA, activeId: item.id, items: [item] };
    writeLocations(c);
    return c;
  },
  all() { return locations.init().items.map(x => Object.assign({}, x)); },
  active() {
    const c = locations.init();
    if (c.unsupported || c.invalid) {
      const legacy = loc.get();
      return legacy ? Object.assign({ id: null, storageIssue: c.unsupported ? "newer" : "invalid" }, legacy) : null;
    }
    const item = activeItem(c);
    return item ? Object.assign({}, item) : null;
  },
  add(l) {
    if (!validLocation(l)) throw new Error("Suite.locations.add needs valid {lat, lon}");
    const c = requireSupported(locations.init());
    const label = String(l.label || "").trim() || "Saved location";
    const item = Object.assign({ id: uniqueId(c, label), label, revision: 1 }, cleanLocation(l));
    item.label = label;
    c.items.push(item);
    const becomesActive = !c.activeId;
    if (becomesActive) c.activeId = item.id;
    const collectionSaved = writeLocations(c);
    const mirrored = collectionSaved && (!becomesActive || mirrorLocation(item));
    let purged = 0;
    if (becomesActive && mirrored) purged = resetLocationState();
    return { location: Object.assign({}, item), purged, saved: !!mirrored };
  },
  update(id, changes) {
    const c = requireSupported(locations.init());
    const item = c.items.find(x => x.id === id);
    if (!item) throw new Error("Unknown saved location: " + id);
    const candidate = {
      lat: changes && changes.lat !== undefined ? changes.lat : item.lat,
      lon: changes && changes.lon !== undefined ? changes.lon : item.lon,
      label: changes && changes.label !== undefined ? changes.label : item.label
    };
    if (!validLocation(candidate)) throw new Error("Suite.locations.update needs valid coordinates");
    const moved = item.lat !== +candidate.lat || item.lon !== +candidate.lon;
    item.lat = +candidate.lat; item.lon = +candidate.lon;
    item.label = String(candidate.label || "").trim() || item.label || "Saved location";
    if (moved) item.revision++;
    const collectionSaved = writeLocations(c);
    let mirrored = collectionSaved;
    let purged = 0;
    if (collectionSaved && c.activeId === id) {
      mirrored = mirrorLocation(item);
      if (moved && mirrored) purged = resetLocationState();
    }
    return { location: Object.assign({}, item), purged, saved: !!mirrored };
  },
  activate(id) {
    const c = requireSupported(locations.init());
    const item = c.items.find(x => x.id === id);
    if (!item) throw new Error("Unknown saved location: " + id);
    const changed = c.activeId !== id;
    c.activeId = id;
    const saved = writeLocations(c);
    const mirrored = saved && mirrorLocation(item);
    return { location: Object.assign({}, item),
      purged: changed && mirrored ? resetLocationState() : 0, saved: !!mirrored };
  },
  remove(id) {
    const c = requireSupported(locations.init());
    const i = c.items.findIndex(x => x.id === id);
    if (i < 0) return { removed: false, active: locations.active(), purged: 0 };
    const wasActive = c.activeId === id;
    c.items.splice(i, 1);
    if (wasActive) c.activeId = c.items[0] ? c.items[0].id : null;
    const saved = c.items.length ? writeLocations(c) : store.remove(LOCATIONS_KEY);
    const next = activeItem(c);
    const mirrored = !wasActive || (saved && mirrorLocation(next));
    return { removed: true, active: next ? Object.assign({}, next) : null,
      purged: wasActive && mirrored ? resetLocationState() : 0, saved: !!(saved && mirrored) };
  }
};

/* ---- API keys: the suite.key.<name> convention (API-AND-RELAY.md §3) ----
   Officially published demo/public keys only — never a personal key. */
const DEMO_KEYS = {
  nasa: "DEMO_KEY",              // api.nasa.gov demo tier: 30/hr, 50/day
  usda: "DEMO_KEY",              // USDA FoodData Central demo tier
  bart: "MW9S-E7SL-26DU-VV8V"    // BART's officially published public key
};
function key(name) {
  const v = store.get("suite.key." + name);
  if (typeof v === "string" && v.trim()) return { value: v.trim(), isDemo: false };
  if (DEMO_KEYS[name]) return { value: DEMO_KEYS[name], isDemo: true };
  return { value: null, isDemo: false };
}

/* ---- optional power-user relay (API-AND-RELAY.md §6) ----
   Unset for everyone by default: tools use their link-out/embedded paths. */
function relay(url) {
  const base = store.get("suite.relay.url");
  if (typeof base !== "string" || !base.trim()) return null;
  const b = base.trim().replace(/\/$/, "");
  return b + (b.includes("?") ? "&" : "?") + "url=" + encodeURIComponent(url);
}

window.Suite = { theme, fetchJSON, store, esc, liveRegion, location: loc, locations, key, relay };

/* ---- PWA registration (PWA.md §1) — inert from file://, forever ----
   The .catch keeps a failed registration from ever costing console noise on a
   page that works perfectly well without the service worker. */
if (location.protocol.startsWith("http") && "serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
})();
</script>
<script>
"use strict";

Suite.theme.init();

/* ---- storage ---- */
const STORE = "suite.notes";
let notes = [];      // {id, title, body, updated}
let currentId = null;

function load() {
  const v = Suite.store.get(STORE); // reads v1's JSON array unchanged
  notes = Array.isArray(v) ? v : [];
  if (!notes.length) {
    notes = [{ id: uid(), title: "Welcome", body: welcomeText(), updated: Date.now() }];
  }
  currentId = notes[0].id;
}
function save() {
  const json = JSON.stringify(notes);
  Suite.store.set(STORE, notes); // writes the same JSON array under the same key
  /* Suite.store.set swallows quota errors, so read back to keep v1's
     "storage full" warning working */
  try {
    if (localStorage.getItem(STORE) !== json) flag("⚠ storage full");
  } catch (e) { flag("⚠ storage full"); }
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function current() { return notes.find(n => n.id === currentId); }
function welcomeText() {
  return "# Welcome\n\nThis is your notepad. Everything you type is **saved automatically** to this browser — nothing is sent anywhere.\n\n## Markdown you can use\n\n- **bold**, *italic*, `inline code`\n- Headings with `#`, `##`, `###`\n- Lists (like this one) and numbered lists\n- > Block quotes\n- [Links](https://example.com)\n\n```\nfenced code blocks too\n```\n\nMake a new note with **+ New note** on the left.";
}

/* ---- safe markdown renderer (no raw innerHTML of user input) ---- */
const esc = Suite.esc;
// inline: escape first, then apply markup on the ESCAPED string with safe replacements.
function inlineMd(s) {
  let t = esc(s);
  // inline code first — protect its contents from further formatting
  // (placeholders are wrapped in U+E000, a private-use char that can't occur via esc())
  const codes = [];
  t = t.replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return "" + (codes.length - 1) + ""; });
  // links [text](url) — only allow http(s)/mailto, url already escaped
  t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, txt, url) => {
    const safe = /^(https?:|mailto:)/i.test(url.replace(/&amp;/g, "&"));
    if (!safe) return m;
    return '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + txt + '</a>';
  });
  t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  t = t.replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>");
  t = t.replace(/__([^_]+)__/g, "<strong>$1</strong>");
  // restore code
  t = t.replace(/(\d+)/g, (m, i) => "<code>" + codes[+i] + "</code>");
  return t;
}
function renderMd(src) {
  const lines = src.replace(/\r\n?/g, "\n").split("\n");
  let html = "", i = 0;
  while (i < lines.length) {
    let line = lines[i];
    // fenced code
    if (/^```/.test(line)) {
      const buf = [];
      i++;
      while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++; // skip closing fence
      html += "<pre><code>" + esc(buf.join("\n")) + "</code></pre>";
      continue;
    }
    // heading
    let h = line.match(/^(#{1,3})\s+(.*)$/);
    if (h) { const n = h[1].length; html += "<h" + n + ">" + inlineMd(h[2]) + "</h" + n + ">"; i++; continue; }
    // hr
    if (/^(\*\*\*+|---+|___+)\s*$/.test(line)) { html += "<hr>"; i++; continue; }
    // blockquote (consecutive)
    if (/^>\s?/.test(line)) {
      const buf = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^>\s?/, "")); i++; }
      html += "<blockquote>" + inlineMd(buf.join(" ")) + "</blockquote>";
      continue;
    }
    // unordered list
    if (/^\s*[-*+]\s+/.test(line)) {
      html += "<ul>";
      while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) {
        html += "<li>" + inlineMd(lines[i].replace(/^\s*[-*+]\s+/, "")) + "</li>"; i++;
      }
      html += "</ul>";
      continue;
    }
    // ordered list
    if (/^\s*\d+[.)]\s+/.test(line)) {
      html += "<ol>";
      while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) {
        html += "<li>" + inlineMd(lines[i].replace(/^\s*\d+[.)]\s+/, "")) + "</li>"; i++;
      }
      html += "</ol>";
      continue;
    }
    // blank
    if (/^\s*$/.test(line)) { i++; continue; }
    // paragraph (gather until blank)
    const buf = [];
    while (i < lines.length && !/^\s*$/.test(lines[i]) &&
           !/^(#{1,3}\s|>|\s*[-*+]\s|\s*\d+[.)]\s|```)/.test(lines[i])) {
      buf.push(lines[i]); i++;
    }
    html += "<p>" + inlineMd(buf.join("\n")).replace(/\n/g, "<br>") + "</p>";
  }
  return html;
}

/* ---- DOM ---- */
const noteList = document.getElementById("noteList");
const editor = document.getElementById("editor");
const noteTitle = document.getElementById("noteTitle");
const preview = document.getElementById("preview");
const wordCount = document.getElementById("wordCount");
const savedEl = Suite.liveRegion(document.getElementById("saved"));

function renderList() {
  noteList.textContent = "";
  const sorted = notes.slice().sort((a, b) => b.updated - a.updated);
  for (const n of sorted) {
    const li = document.createElement("li");
    li.className = n.id === currentId ? "on" : "";
    li.tabIndex = 0; // a11y: keyboard path to note selection
    const nm = document.createElement("span");
    nm.className = "nm"; nm.textContent = n.title || "Untitled note";
    const wc = document.createElement("span");
    wc.className = "wc"; wc.textContent = countWords(n.body);
    const del = document.createElement("button");
    del.className = "del"; del.textContent = "×"; del.title = "Delete note";
    del.setAttribute("aria-label", 'Delete note "' + (n.title || "Untitled note") + '"');
    del.addEventListener("click", (e) => { e.stopPropagation(); deleteNote(n.id); });
    li.append(nm, wc, del);
    li.addEventListener("click", () => selectNote(n.id));
    li.addEventListener("keydown", (e) => {
      if ((e.key === "Enter" || e.key === " ") && e.target === li) { e.preventDefault(); selectNote(n.id); }
    });
    noteList.append(li);
  }
}
function countWords(s) {
  const w = (s.trim().match(/\S+/g) || []).length;
  return w;
}
function selectNote(id) {
  flushSave();
  currentId = id;
  const n = current();
  editor.value = n.body;
  noteTitle.value = n.title;
  updateView();
  renderList();
  editor.focus();
}
function updateView() {
  const n = current();
  if (!n) return;
  preview.innerHTML = renderMd(editor.value);
  wordCount.textContent = countWords(editor.value) + " words · " + editor.value.length + " chars";
}
function deleteNote(id) {
  const n = notes.find(x => x.id === id);
  if (!confirm('Delete "' + (n.title || "Untitled note") + '"? This cannot be undone.')) return;
  notes = notes.filter(x => x.id !== id);
  if (!notes.length) notes = [{ id: uid(), title: "Untitled note", body: "", updated: Date.now() }];
  if (currentId === id) currentId = notes[0].id;
  save();
  const c = current();
  editor.value = c.body; noteTitle.value = c.title;
  updateView(); renderList();
}

/* ---- autosave (debounced) ---- */
let saveTimer = null, dirty = false;
function flag(txt) { savedEl.textContent = txt; }
function markDirty() {
  dirty = true;
  savedEl.textContent = "editing…"; savedEl.classList.add("dirty");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, 600);
}
function flushSave() {
  if (!dirty) return;
  const n = current();
  if (n) {
    n.body = editor.value;
    n.title = noteTitle.value.trim() || firstLineTitle(editor.value);
    noteTitle.placeholder = n.title;
    n.updated = Date.now();
  }
  save();
  dirty = false;
  savedEl.textContent = "saved ✓"; savedEl.classList.remove("dirty");
  renderList();
}
function firstLineTitle(body) {
  const first = (body.split("\n").find(l => l.trim()) || "").replace(/^#+\s*/, "").trim();
  return first ? first.slice(0, 40) : "Untitled note";
}

editor.addEventListener("input", () => { updateView(); markDirty(); });
noteTitle.addEventListener("input", markDirty);
window.addEventListener("beforeunload", flushSave);

/* ---- toolbar actions ---- */
document.getElementById("newNote").addEventListener("click", () => {
  flushSave();
  const n = { id: uid(), title: "Untitled note", body: "", updated: Date.now() };
  notes.push(n); currentId = n.id;
  editor.value = ""; noteTitle.value = "";
  save(); updateView(); renderList(); editor.focus();
});
function download(name, text, type) {
  const blob = new Blob([text], { type: type || "text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
document.getElementById("exportMd").addEventListener("click", () => {
  flushSave();
  const n = current();
  const safe = (n.title || "note").replace(/[^\w \-]+/g, "").trim() || "note";
  download(safe + ".md", n.body, "text/markdown");
});
document.getElementById("exportAll").addEventListener("click", () => {
  flushSave();
  download("notes-" + new Date().toISOString().slice(0, 10) + ".json",
    JSON.stringify(notes, null, 2), "application/json");
});
document.getElementById("importBtn").addEventListener("click", () => document.getElementById("importFile").click());
document.getElementById("importFile").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.addEventListener("load", () => {
    try {
      const data = JSON.parse(reader.result);
      let imported = [];
      if (Array.isArray(data)) imported = data;
      else if (data && typeof data === "object" && "body" in data) imported = [data];
      else throw new Error("unrecognized");
      let added = 0;
      for (const it of imported) {
        if (it && typeof it.body === "string") {
          notes.push({
            id: uid(),
            title: (typeof it.title === "string" ? it.title : "") || firstLineTitle(it.body),
            body: it.body,
            updated: typeof it.updated === "number" ? it.updated : Date.now(),
          });
          added++;
        }
      }
      if (!added) { alert("No notes found in that file."); return; }
      save(); renderList();
      alert("Imported " + added + " note" + (added === 1 ? "" : "s") + ".");
    } catch (err) {
      alert("Could not read that file as notes JSON.");
    }
    e.target.value = "";
  });
  reader.readAsText(file);
});

/* preview toggle */
let previewOn = true;
document.getElementById("togglePreview").addEventListener("click", (e) => {
  previewOn = !previewOn;
  preview.style.display = previewOn ? "" : "none";
  e.currentTarget.setAttribute("aria-pressed", String(previewOn));
});

/* keyboard: Ctrl/Cmd+S saves now */
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); flushSave(); }
});

/* ---- init ---- */
load();
editor.value = current().body;
noteTitle.value = current().title;
updateView();
renderList();
savedEl.textContent = "saved ✓";
</script>
</body>
</html>
