<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rocket Launch Schedule · Local Suite</title>
<link rel="stylesheet" href="../core/suite.css" data-suite-inline>
<style>
  /* tool accents: launch-status colors (3-layer, same pattern as core) */
  /* a11y (Phase 4): light values darkened / dark --fail lightened so badge text clears
     4.5:1 against its own 18% tint over the card (was 3.9/3.1/4.1 light, 4.0 dark-fail) */
  :root { --go: #2c5f35; --tbd: #83561a; --fail: #ab2e1f; }
  @media (prefers-color-scheme: dark) {
    :root { --go: #7dc487; --tbd: #d69a4c; --fail: #e88574; }
  }
  :root[data-theme="light"] { --go: #2c5f35; --tbd: #83561a; --fail: #ab2e1f; }
  :root[data-theme="dark"] { --go: #7dc487; --tbd: #d69a4c; --fail: #e88574; }

  body { min-height: 100vh; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: .9rem 1.25rem; gap: 1rem;
    position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line);
  }
  /* v1 launches uses the muted topbar back link, not the core accent link */
  .back { color: var(--muted); }
  .back:hover { color: var(--accent); text-decoration: none; }
  .theme-btn { float: none; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }
  h1 { font-size: 1.5rem; letter-spacing: -.02em; }
  .sub { color: var(--muted); margin-top: .2rem; font-size: .92rem; }

  .next {
    margin: 1.4rem 0; background: var(--card); border: 1px solid var(--line);
    border-radius: 16px; box-shadow: var(--shadow); padding: 1.5rem 1.5rem 1.6rem;
    text-align: center;
  }
  .next .eyebrow { font-size: .76rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
  .next .rname { font-size: 1.35rem; letter-spacing: -.01em; margin: .35rem 0 .1rem; }
  .next .prov { color: var(--muted); font-size: .92rem; }
  .cd {
    display: flex; justify-content: center; gap: 1.4rem; margin: 1.2rem 0 .6rem; flex-wrap: wrap;
  }
  .cd .unit { min-width: 3.4rem; }
  .cd .v { font-size: 2.4rem; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .cd .l { font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-top: .3rem; }
  .cd.past .v { color: var(--muted); }
  .next .when { color: var(--muted); font-size: .88rem; margin-top: .3rem; }
  .approx { color: var(--tbd); font-size: .85rem; margin-top: .6rem; }

  .badge {
    display: inline-block; font-size: .74rem; font-weight: 600; padding: .16rem .6rem;
    border-radius: 999px; vertical-align: middle;
  }
  .badge.go { background: color-mix(in srgb, var(--go) 18%, transparent); color: var(--go); }
  .badge.tbd { background: color-mix(in srgb, var(--tbd) 18%, transparent); color: var(--tbd); }
  .badge.fail { background: color-mix(in srgb, var(--fail) 18%, transparent); color: var(--fail); }
  .badge.info { background: var(--accent-soft); color: var(--accent); }

  .controls { display: flex; gap: .5rem; align-items: center; margin: 1.4rem 0 .2rem; }
  .controls .grow { flex: 1; }
  .controls button {
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 10px; padding: .45rem .75rem; font-size: .9rem; cursor: pointer; font-family: inherit;
  }
  .controls button:hover { border-color: var(--accent); }
  h2 { font-size: 1.05rem; margin: 1.2rem 0 .2rem; }

  .list { display: flex; flex-direction: column; gap: .7rem; margin-top: .7rem; }
  .launch {
    background: var(--card); border: 1px solid var(--line); border-radius: 13px;
    box-shadow: var(--shadow); padding: 1rem 1.1rem; display: flex; gap: 1rem; align-items: flex-start;
  }
  .launch .main { flex: 1; min-width: 0; }
  .launch .lname { font-weight: 600; font-size: 1.02rem; }
  .launch .row2 { color: var(--muted); font-size: .86rem; margin-top: .25rem; display: flex; flex-wrap: wrap; gap: .2rem .8rem; }
  .launch .blurb { font-size: .88rem; color: var(--ink); margin-top: .55rem; max-width: 70ch; }
  .launch .side { text-align: right; flex: none; min-width: 8.5rem; }
  .launch .side .t0 { font-weight: 600; font-size: .95rem; font-variant-numeric: tabular-nums; }
  .launch .side .rel { color: var(--muted); font-size: .8rem; margin-top: .2rem; }
  @media (max-width: 560px) {
    .launch { flex-direction: column; }
    .launch .side { text-align: left; min-width: 0; }
  }

  .msg { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
    padding: 2.5rem 1.5rem; text-align: center; color: var(--muted); }
  .msg.err { border-color: color-mix(in srgb, #c0392b 40%, var(--line)); }
  .stamp { color: var(--muted); font-size: .8rem; margin-top: 1rem; }
  .throttle-note { color: var(--muted); font-size: .8rem; margin-top: .4rem; }
  footer { margin-top: 2.4rem; font-size: .84rem; }
  .skeleton { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:.55} 50%{opacity:1} }
</style>
</head>
<body>
<div class="topbar">
  <a class="back" href="index.html">← suite</a>
  <button class="theme-btn" id="themeBtn" title="Toggle light/dark">◐ theme</button>
</div>

<div class="wrap">
  <h1>Rocket Launch Schedule</h1>
  <p class="sub">The next launches worldwide, with a live countdown to liftoff.</p>

  <div id="next"></div>

  <div class="controls">
    <div class="grow"></div>
    <button id="refreshBtn" title="Fetch fresh data (the service allows ~15 requests/hour — this page caches for an hour)">↻ refresh</button>
  </div>
  <p class="throttle-note">This feed is rate-limited to about 15 requests/hour, so the page serves its cached copy and only fetches fresh data once an hour.</p>

  <h2 id="listHead" style="display:none">Upcoming</h2>
  <div class="list" id="list"></div>
  <p class="stamp" id="stamp"></p>

  <footer>Data: The Space Devs · Launch Library 2 (ll.thespacedevs.com)</footer>
</div>

<script src="../core/suite.js" data-suite-inline></script>
<script>
"use strict";

Suite.theme.init();

/* ---- helpers ---- */
const CACHE_KEY = "suite.cache.launches.upcoming";
const BACKOFF_KEY = "suite.launches.backoffUntil";
const REFRESH_MS = 3600000;                 // 1 hour — respect the 15/hr throttle (manifest cacheTtlMin: 60)
const FEED_URL = "https://ll.thespacedevs.com/2.3.0/launches/upcoming/?limit=10&mode=normal";
const nextEl = document.getElementById("next");
const listEl = document.getElementById("list");
const stampEl = Suite.liveRegion(document.getElementById("stamp"));

function cacheGet() {
  const e = Suite.store.get(CACHE_KEY);
  return (e && typeof e === "object" && "t" in e && "v" in e) ? e : null;
}
/* v1 cached the slimmed array; Suite.fetchJSON caches the raw LL2 payload.
   Accept both shapes so a v1 user's existing cache keeps rendering. */
function itemsOf(v) {
  return Array.isArray(v) ? v : ((v && v.results) || []).map(slim);
}
function ago(t) {
  const s = Math.round((Date.now() - t) / 1000);
  if (s < 90) return "just now";
  if (s < 5400) return Math.round(s / 60) + " min ago";
  if (s < 172800) return Math.round(s / 3600) + " hr ago";
  return Math.round(s / 86400) + " days ago";
}
function preciseTime(p) {
  const n = (p || "").toLowerCase();
  return n === "second" || n === "minute" || n === "hour";
}
function badgeClass(abbrev) {
  const a = (abbrev || "").toLowerCase();
  if (a === "go" || a === "success") return "go";
  if (a === "tbd" || a === "tbc" || a === "hold") return "tbd";
  if (a === "failure" || a === "partial failure") return "fail";
  return "info";
}

/* map a raw LL2 result to a compact shape we render from */
function slim(r) {
  const rocket = r.rocket && r.rocket.configuration;
  return {
    id: r.id,
    name: r.name,
    net: r.net,
    precision: r.net_precision && r.net_precision.name,
    status: r.status ? { name: r.status.name, abbrev: r.status.abbrev } : null,
    provider: r.launch_service_provider ? r.launch_service_provider.name : "",
    rocket: rocket ? (rocket.name || rocket.full_name) : "",
    pad: r.pad ? r.pad.name : "",
    location: r.pad && r.pad.location ? r.pad.location.name : "",
    mission: r.mission ? {
      name: r.mission.name,
      description: r.mission.description,
      orbit: r.mission.orbit ? (r.mission.orbit.abbrev || r.mission.orbit.name) : "",
      type: r.mission.type,
    } : null,
  };
}

/* ---- countdown ---- */
let cdData = null, cdTimer = null;

function renderNext(item) {
  cdData = item;
  nextEl.innerHTML = "";
  const box = document.createElement("div");
  box.className = "next";
  const t0 = item ? new Date(item.net) : null;

  const eyebrow = document.createElement("div");
  eyebrow.className = "eyebrow";
  eyebrow.textContent = "Next launch";
  const rname = document.createElement("div"); rname.className = "rname"; rname.textContent = item.name;
  const prov = document.createElement("div"); prov.className = "prov";
  prov.textContent = [item.provider, item.location].filter(Boolean).join(" · ");
  box.append(eyebrow, rname, prov);

  if (item.status) {
    const b = document.createElement("span");
    b.className = "badge " + badgeClass(item.status.abbrev);
    b.textContent = item.status.name;
    b.style.marginTop = ".5rem"; b.style.display = "inline-block";
    box.append(b);
  }

  if (preciseTime(item.precision)) {
    const cd = document.createElement("div"); cd.className = "cd"; cd.id = "cdBox";
    ["Days", "Hours", "Min", "Sec"].forEach(l => {
      const u = document.createElement("div"); u.className = "unit";
      const v = document.createElement("div"); v.className = "v"; v.textContent = "–"; v.dataset.u = l;
      const lab = document.createElement("div"); lab.className = "l"; lab.textContent = l;
      u.append(v, lab); cd.append(u);
    });
    box.append(cd);
    const when = document.createElement("div"); when.className = "when";
    when.textContent = t0.toLocaleString(undefined, { weekday: "short", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) +
      " (" + Intl.DateTimeFormat().resolvedOptions().timeZone + ")";
    box.append(when);
  } else {
    const ap = document.createElement("div"); ap.className = "approx";
    ap.textContent = "Targeting " + t0.toLocaleDateString(undefined, { month: "long", day: "numeric", year: "numeric" }) +
      " — date not yet firm (precision: " + (item.precision || "unknown") + ").";
    box.append(ap);
  }
  nextEl.append(box);
  tick();
}

function tick() {
  if (!cdData) return;
  const box = document.getElementById("cdBox");
  if (!box) return;
  let diff = new Date(cdData.net).getTime() - Date.now();
  const past = diff < 0;
  box.classList.toggle("past", past);
  diff = Math.abs(diff);
  const d = Math.floor(diff / 86400000);
  const h = Math.floor(diff / 3600000) % 24;
  const m = Math.floor(diff / 60000) % 60;
  const s = Math.floor(diff / 1000) % 60;
  const map = { Days: d, Hours: h, Min: m, Sec: s };
  box.querySelectorAll(".v").forEach(v => {
    v.textContent = (map[v.dataset.u] < 10 && v.dataset.u !== "Days" ? "0" : "") + map[v.dataset.u];
  });
  const when = box.parentElement.querySelector(".when");
  if (past && when && !when.dataset.flagged) {
    when.dataset.flagged = "1";
    when.textContent = "T-0 has passed — awaiting confirmation. " + when.textContent;
  }
}

/* ---- list ---- */
function relStr(net, precise) {
  const diff = new Date(net).getTime() - Date.now();
  const past = diff < 0; const a = Math.abs(diff);
  const d = Math.floor(a / 86400000), h = Math.floor(a / 3600000) % 24;
  let out = d > 0 ? d + "d " + h + "h" : h + "h " + (Math.floor(a / 60000) % 60) + "m";
  if (!precise) out = "~" + out;
  return (past ? "" : "T- ") + out + (past ? " ago" : "");
}
function renderList(items) {
  listEl.innerHTML = "";
  document.getElementById("listHead").style.display = items.length ? "" : "none";
  items.forEach(item => {
    const el = document.createElement("div");
    el.className = "launch";
    const main = document.createElement("div"); main.className = "main";
    const nm = document.createElement("div"); nm.className = "lname"; nm.textContent = item.name;
    if (item.status) {
      const b = document.createElement("span");
      b.className = "badge " + badgeClass(item.status.abbrev);
      b.textContent = item.status.name; b.style.marginLeft = ".5rem";
      nm.append(b);
    }
    const row2 = document.createElement("div"); row2.className = "row2";
    const bits = [];
    if (item.rocket) bits.push("🚀 " + item.rocket);
    if (item.pad || item.location) bits.push("📍 " + [item.pad, item.location].filter(Boolean).join(", "));
    if (item.mission && item.mission.orbit) bits.push("🛰 " + item.mission.orbit);
    bits.forEach(b => { const s = document.createElement("span"); s.textContent = b; row2.append(s); });
    main.append(nm, row2);
    if (item.mission && item.mission.description) {
      const bl = document.createElement("div"); bl.className = "blurb";
      const d = item.mission.description;
      bl.textContent = d.length > 260 ? d.slice(0, 257) + "…" : d;
      main.append(bl);
    }
    const side = document.createElement("div"); side.className = "side";
    const t0 = document.createElement("div"); t0.className = "t0";
    const dt = new Date(item.net);
    t0.textContent = preciseTime(item.precision)
      ? dt.toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" })
      : dt.toLocaleDateString(undefined, { month: "short", day: "numeric" });
    const rel = document.createElement("div"); rel.className = "rel";
    rel.textContent = relStr(item.net, preciseTime(item.precision));
    side.append(t0, rel);
    el.append(main, side);
    listEl.append(el);
  });
}

function paint(items, stampMsg) {
  // choose next: first future launch, else first item
  const now = Date.now();
  const upcoming = items.filter(i => i.status && !/success|failure/i.test(i.status.abbrev || ""));
  const future = items.find(i => new Date(i.net).getTime() > now) || items[0];
  if (future) renderNext(future);
  renderList(items);
  stampEl.textContent = stampMsg;
}

/* ---- load ---- */
async function load(force) {
  const cached = cacheGet();
  // Always serve cache first.
  if (cached) {
    paint(itemsOf(cached.v), "Cached · updated " + ago(cached.t) + ".");
  } else {
    nextEl.innerHTML = "";
    const sk = document.createElement("div"); sk.className = "msg skeleton"; sk.textContent = "Loading launch schedule…";
    nextEl.append(sk);
  }
  const fresh = cached && (Date.now() - cached.t) < REFRESH_MS;
  if (fresh && !force) return;   // within the hour — don't spend a request

  /* 429 backoff (flags: ["rl"]): after a throttle response the effective TTL is
     doubled — the auto-refetch is skipped until the backoff window passes.
     An explicit ↻ refresh still forces a request. */
  const backoffUntil = +Suite.store.get(BACKOFF_KEY, 0) || 0;
  if (!force && cached && Date.now() < backoffUntil) {
    stampEl.textContent = "Source is rate-limiting — showing cached data from " + ago(cached.t) + ".";
    return;
  }

  try {
    const r = await Suite.fetchJSON(FEED_URL, {
      cacheKey: "launches.upcoming", ttl: force ? 0 : REFRESH_MS, fallbackToCache: false
    });
    Suite.store.remove(BACKOFF_KEY);
    paint(itemsOf(r.v), "Updated just now.");
  } catch (err) {
    const throttled = /HTTP (429|403)\b/.test((err && err.message) || "");
    if (throttled) Suite.store.set(BACKOFF_KEY, Date.now() + REFRESH_MS);
    if (cached) {
      stampEl.textContent = (throttled ? "Rate limit reached — " : "Live fetch failed — ") +
        "showing cached schedule from " + ago(cached.t) + ".";
    } else {
      nextEl.innerHTML = "";
      const m = document.createElement("div"); m.className = "msg err";
      m.innerHTML = "<p style='color:var(--ink);font-weight:600;margin-bottom:.4rem'>Couldn't load launches</p>";
      const p = document.createElement("p");
      p.textContent = throttled ? "Rate limited — the feed allows ~15/hour."
        : ((err && err.message) || "Check your connection and try refresh.");
      m.append(p); nextEl.append(m);
    }
  }
}

document.getElementById("refreshBtn").addEventListener("click", () => load(true));
cdTimer = setInterval(tick, 1000);
load(false);
</script>
</body>
</html>
