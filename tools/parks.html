<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>National Parks Companion · Local Suite</title>
<link rel="stylesheet" href="../core/suite.css" data-suite-inline>
<style>
  /* tool accents: alert-category palette (3-layer, same pattern as core) */
  /* a11y (Phase 4): light --closure/--caution darkened so white badge text clears 4.5:1
     (was 3.3/3.0); --catink switches the badge text to near-black on the light dark-theme
     pastels (white was 2.4–3.3 on them) */
  :root { --danger: #c0392b; --closure: #9c6420; --caution: #856612; --info: #2f6f6a; --catink: #fff; }
  @media (prefers-color-scheme: dark) {
    :root { --danger: #e0685a; --closure: #d09a53; --caution: #cbb45a; --info: #6fb5ae; --catink: #15171b; }
  }
  :root[data-theme="light"] { --danger: #c0392b; --closure: #9c6420; --caution: #856612; --info: #2f6f6a; --catink: #fff; }
  :root[data-theme="dark"] { --danger: #e0685a; --closure: #d09a53; --caution: #cbb45a; --info: #6fb5ae; --catink: #15171b; }

  body { padding: 1.4rem 1.25rem 4rem; }
  .wrap { max-width: 900px; margin: 0 auto; }
  .topbar { display: flex; align-items: center; gap: 1rem; }
  .back { white-space: nowrap; }
  .theme-btn { margin-left: auto; float: none; }
  header h1 { font-size: 1.7rem; letter-spacing: -.02em; margin-top: .8rem; }
  header .tag { color: var(--muted); margin-top: .3rem; max-width: 46rem; font-size: .95rem; }
  .picker { margin-top: 1.3rem; background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 1rem 1.1rem; }
  .picker h2 { font-size: 1rem; margin-bottom: .5rem; }
  .selected { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: .6rem; }
  .pchip {
    display: inline-flex; align-items: center; gap: .35rem; background: var(--accent-soft); color: var(--accent);
    border: 1px solid var(--accent); border-radius: 999px; padding: .2rem .3rem .2rem .65rem; font-size: .82rem;
  }
  .pchip button { border: none; background: none; color: var(--accent); cursor: pointer; font-size: .9rem; line-height: 1; padding: 0 .2rem; }
  input[type=text], input[type=search] {
    width: 100%; font: inherit; font-size: .92rem; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: .5rem .7rem;
  }
  .options { max-height: 240px; overflow-y: auto; margin-top: .5rem; border: 1px solid var(--line); border-radius: 10px; }
  .opt { padding: .4rem .7rem; cursor: pointer; font-size: .9rem; display: flex; justify-content: space-between; gap: .5rem; border-bottom: 1px solid var(--line); }
  .opt:last-child { border-bottom: none; }
  .opt:hover { background: var(--accent-soft); }
  .opt.on { color: var(--accent); font-weight: 600; }
  .opt .code { font-size: .74rem; color: var(--muted); font-family: ui-monospace, Consolas, monospace; }
  .parkgroup { margin-top: 1.4rem; }
  .parkgroup > h2 { font-size: 1.12rem; display: flex; align-items: baseline; gap: .5rem; }
  .parkgroup > h2 .n { font-size: .8rem; color: var(--muted); font-weight: 500; }
  .parkgroup > h2 a { font-size: .8rem; margin-left: auto; }
  .alert {
    background: var(--card); border: 1px solid var(--line); border-left-width: 4px; border-radius: 12px;
    padding: .8rem 1rem; box-shadow: var(--shadow); margin-top: .7rem;
  }
  .alert.k-danger { border-left-color: var(--danger); }
  .alert.k-closure { border-left-color: var(--closure); }
  .alert.k-caution { border-left-color: var(--caution); }
  .alert.k-info { border-left-color: var(--info); }
  .alert .cat {
    display: inline-block; font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
    color: var(--catink); border-radius: 6px; padding: .1rem .45rem; margin-bottom: .35rem;
  }
  .cat.k-danger { background: var(--danger); } .cat.k-closure { background: var(--closure); }
  .cat.k-caution { background: var(--caution); } .cat.k-info { background: var(--info); }
  .alert h3 { font-size: .98rem; line-height: 1.35; }
  .alert h3 a { color: var(--ink); text-decoration: none; }
  .alert h3 a:hover { color: var(--accent); text-decoration: underline; }
  .alert .desc { font-size: .88rem; color: var(--muted); margin-top: .35rem; }
  .card-msg {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 1.2rem 1.15rem; box-shadow: var(--shadow); color: var(--muted); font-size: .92rem;
  }
  .card-msg h3 { color: var(--ink); font-size: 1.05rem; margin-bottom: .5rem; }
  .card-msg p { margin-bottom: .6rem; }
  .card-msg .keyrow { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .6rem; }
  .card-msg .keyrow input { flex: 1; min-width: 200px; }
  button.primary {
    border: 1px solid var(--accent); background: var(--accent); color: var(--bg); /* a11y: was #fff — 2.4:1 on the dark accent */
    border-radius: 10px; padding: .5rem 1rem; cursor: pointer; font: inherit; font-size: .9rem;
  }
  button.ghost {
    border: 1px solid var(--line); background: var(--card); color: var(--accent);
    border-radius: 999px; padding: .28rem .7rem; cursor: pointer; font: inherit; font-size: .8rem;
  }
  .stamp { font-size: .78rem; color: var(--muted); margin-top: .4rem; }
  footer { font-size: .82rem; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="index.html">← suite</a>
    <button class="theme-btn" id="themeBtn" title="Toggle light/dark">◐ theme</button>
  </div>
  <header>
    <h1>National Parks Companion</h1>
    <p class="tag">Current alerts — closures, danger notices, and caution advisories — for the parks you're
      planning to visit, straight from the National Park Service.</p>
  </header>

  <div id="app"></div>
  <div id="content"></div>

  <footer>Data: National Park Service · developer.nps.gov. Free key from developer.nps.gov/get-started.</footer>
</div>

<script src="../core/suite.js" data-suite-inline></script>
<script>
"use strict";

Suite.theme.init();

/* ---- helpers ---- */
const KEY_NAME = "nps"; // suite.key.nps — no demo tier (Suite.key falls through to null)
function getKey(){ return Suite.key(KEY_NAME).value || ""; }
function cacheGet(key){
  const e = Suite.store.get("suite.cache.parks." + key);
  return (e && typeof e === "object" && "t" in e && "v" in e) ? e : null;
}
function cacheSet(key, v){ Suite.store.set("suite.cache.parks." + key, { t: Date.now(), v: v }); }
/* Suite.fetchJSON reports HTTP failures as Error("HTTP <status>") — recover the status
   for the invalid-key (401/403) gate. */
function statusOf(e){ const m = /^HTTP (\d+)$/.exec((e && e.message) || ""); return m ? +m[1] : 0; }
function fmtTime(ms){ return new Date(ms).toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}); }
function catInfo(c){
  const s = (c || "").toLowerCase();
  if (s.indexOf("danger") >= 0) return { label: "Danger", cls: "k-danger", rank: 0 };
  if (s.indexOf("closure") >= 0) return { label: c || "Closure", cls: "k-closure", rank: 1 };
  if (s.indexOf("caution") >= 0) return { label: "Caution", cls: "k-caution", rank: 2 };
  return { label: c || "Information", cls: "k-info", rank: 3 };
}

/* good-citizen TTLs: alerts per the manifest (cacheTtlMin 360); the park roster is
   reference data and keeps v1's 30-day window */
const ALERTS_TTL = 360 * 60 * 1000;
const PARKLIST_TTL = 30 * 24 * 3600 * 1000;

const app = Suite.liveRegion(document.getElementById("app"));
const content = Suite.liveRegion(document.getElementById("content"));
const state = { parks: [], selected: [] };
{
  const sel = Suite.store.get("suite.parks", []);
  state.selected = Array.isArray(sel) ? sel : [];
}

function msgCard(container, title, lines){
  container.textContent = "";
  const c = document.createElement("div"); c.className = "card-msg";
  if (title){ const h = document.createElement("h3"); h.textContent = title; c.append(h); }
  (lines || []).forEach(function(t){ const p = document.createElement("p"); p.textContent = t; c.append(p); });
  container.append(c);
  return c;
}

/* ---- key gate (designed no-key state: explanation + paste field + signup link) ---- */
function showKeyCard(invalid){
  content.textContent = "";
  const c = msgCard(app, invalid ? "That key didn't work" : "Add your free NPS key",
    invalid ? ["The National Park Service API rejected the saved key. Paste a valid one below."]
      : ["The NPS API needs a free key. Get one instantly at developer.nps.gov/get-started. Paste it here — it stays in this browser only, sent only to the NPS API."]);
  const row = document.createElement("div"); row.className = "keyrow";
  const inp = document.createElement("input"); inp.type = "text"; inp.placeholder = "paste API key";
  inp.setAttribute("aria-label", "NPS API key");
  inp.value = invalid ? "" : getKey();
  const btn = document.createElement("button"); btn.className = "primary"; btn.textContent = "Save key";
  btn.addEventListener("click", function(){ const v = inp.value.trim(); if (!v) return; Suite.store.set("suite.key." + KEY_NAME, v); boot(); });
  inp.addEventListener("keydown", function(e){ if (e.key === "Enter") btn.click(); });
  row.append(inp, btn);
  const link = document.createElement("p");
  const a = document.createElement("a"); a.href = "https://www.nps.gov/subjects/developer/get-started.htm"; a.target = "_blank"; a.rel = "noopener"; a.textContent = "Open developer.nps.gov/get-started →";
  link.append(a); c.append(row, link);
}

/* ---- park list ---- */
async function loadParks(){
  const cached = cacheGet("parklist");
  if (cached && Date.now() - cached.t < PARKLIST_TTL && cached.v.length){ state.parks = cached.v; return; }
  msgCard(app, "Loading park list…", ["Fetching the roster of national park units (once — then cached)."]);
  const url = "https://developer.nps.gov/api/v1/parks?limit=600&api_key=" + encodeURIComponent(getKey());
  try {
    /* cache handled manually: v1 stores the slim mapped array, not the raw response */
    const r = await Suite.fetchJSON(url, { timeout: 15000, fallbackToCache: false });
    const parks = (r.v.data || []).map(function(p){ return { code: p.parkCode, name: p.fullName, states: p.states }; })
      .filter(function(p){ return p.code && p.name; })
      .sort(function(a,b){ return a.name.localeCompare(b.name); });
    if (parks.length){ cacheSet("parklist", parks); state.parks = parks; }
    else if (cached){ state.parks = cached.v; }
  } catch(e){
    const s = statusOf(e);
    if (s === 403 || s === 401){ showKeyCard(true); throw e; }
    if (cached){ state.parks = cached.v; return; }
    msgCard(app, "Couldn't load the park list",
      ["Network error" + (e && e.message ? " (" + e.message + ")" : "") + ". Check your connection and reload."]);
    throw e;
  }
}

/* ---- picker UI ---- */
function renderPicker(){
  app.textContent = "";
  const box = document.createElement("div"); box.className = "picker";
  const head = document.createElement("h2"); head.textContent = "Parks you're watching";
  const chg = document.createElement("button"); chg.className = "ghost"; chg.textContent = "change key"; chg.style.marginLeft = ".6rem";
  chg.addEventListener("click", function(){ showKeyCard(false); });
  head.append(chg);
  const sel = document.createElement("div"); sel.className = "selected";
  const search = document.createElement("input"); search.type = "search"; search.placeholder = "Search parks (name or state)…";
  search.setAttribute("aria-label", "Search parks by name, state, or code");
  const opts = document.createElement("div"); opts.className = "options";
  opts.setAttribute("role", "listbox");
  opts.setAttribute("aria-multiselectable", "true");
  opts.setAttribute("aria-label", "Park list — select the parks to watch");
  box.append(head, sel, search, opts);
  app.append(box);

  function nameFor(code){ const f = state.parks.filter(function(p){ return p.code === code; })[0]; return f ? f.name : code; }
  function drawSelected(){
    sel.textContent = "";
    if (!state.selected.length){ const s = document.createElement("span"); s.className = "stamp"; s.textContent = "None yet — pick from the list below."; sel.append(s); return; }
    state.selected.forEach(function(code){
      const chip = document.createElement("span"); chip.className = "pchip";
      chip.append(document.createTextNode(nameFor(code)));
      const x = document.createElement("button"); x.textContent = "×"; x.title = "remove";
      x.setAttribute("aria-label", "Remove " + nameFor(code));
      x.addEventListener("click", function(){ state.selected = state.selected.filter(function(c){ return c !== code; }); persist(); drawSelected(); drawOpts(); loadAlerts(); });
      chip.append(x); sel.append(chip);
    });
  }
  function drawOpts(){
    const q = search.value.trim().toLowerCase();
    opts.textContent = "";
    const matched = state.parks.filter(function(p){
      if (!q) return true;
      return p.name.toLowerCase().indexOf(q) >= 0 || (p.states || "").toLowerCase().indexOf(q) >= 0 || p.code.indexOf(q) >= 0;
    }).slice(0, 60);
    matched.forEach(function(p){
      const on = state.selected.indexOf(p.code) >= 0;
      const row = document.createElement("div"); row.className = "opt" + (on ? " on" : "");
      row.setAttribute("role", "option");
      row.setAttribute("aria-selected", String(on));
      row.tabIndex = 0;
      const left = document.createElement("span"); left.textContent = p.name + (p.states ? " (" + p.states + ")" : "");
      const code = document.createElement("span"); code.className = "code"; code.textContent = p.code;
      row.append(left, code);
      function toggle(){
        const i = state.selected.indexOf(p.code);
        if (i >= 0) state.selected.splice(i, 1); else state.selected.push(p.code);
        persist(); drawSelected(); drawOpts(); loadAlerts();
      }
      row.addEventListener("click", toggle);
      row.addEventListener("keydown", function(e){ if (e.key === "Enter" || e.key === " "){ e.preventDefault(); toggle(); } });
      opts.append(row);
    });
    if (!matched.length){ const e = document.createElement("div"); e.className = "opt"; e.textContent = "No parks match."; opts.append(e); }
  }
  function persist(){ Suite.store.set("suite.parks", state.selected); }
  search.addEventListener("input", drawOpts);
  drawSelected(); drawOpts();
}

/* ---- alerts ---- */
async function loadAlerts(){
  if (!state.selected.length){ msgCard(content, "Pick a park", ["Choose one or more parks above to see their current alerts."]); return; }
  const codes = state.selected.slice().sort();
  const cacheKey = "alerts." + codes.join(",");
  const cached = cacheGet(cacheKey);
  if (cached && Date.now() - cached.t < ALERTS_TTL){ renderAlerts(cached.v, cached.t, false); return; }
  msgCard(content, "Loading alerts…", ["Checking " + codes.length + " park" + (codes.length === 1 ? "" : "s") + "."]);
  const url = "https://developer.nps.gov/api/v1/alerts?parkCode=" + encodeURIComponent(codes.join(",")) + "&limit=200&api_key=" + encodeURIComponent(getKey());
  try {
    /* cache handled manually: v1 stores the alerts array, not the raw response */
    const r = await Suite.fetchJSON(url, { timeout: 15000, fallbackToCache: false });
    const alerts = r.v.data || [];
    cacheSet(cacheKey, alerts);
    renderAlerts(alerts, Date.now(), false);
  } catch(e){
    const s = statusOf(e);
    if (s === 403 || s === 401){ showKeyCard(true); return; }
    if (cached){ renderAlerts(cached.v, cached.t, true); return; }
    msgCard(content, "Couldn't load alerts", ["Network error" + (e && e.message ? " (" + e.message + ")" : "") + ". Try again shortly."]);
  }
}

function nameFor(code){ const f = state.parks.filter(function(p){ return p.code === code; })[0]; return f ? f.name : code.toUpperCase(); }

function renderAlerts(alerts, stampMs, stale){
  content.textContent = "";
  const stamp = document.createElement("div"); stamp.className = "stamp";
  stamp.textContent = (stale ? "Offline — cached data from " : "data from ") + fmtTime(stampMs);
  content.append(stamp);
  const byPark = {};
  state.selected.forEach(function(c){ byPark[c] = []; });
  alerts.forEach(function(a){ const c = a.parkCode || "?"; if (!byPark[c]) byPark[c] = []; byPark[c].push(a); });
  state.selected.forEach(function(code){
    const group = document.createElement("section"); group.className = "parkgroup";
    const h = document.createElement("h2");
    h.append(document.createTextNode(nameFor(code)));
    const n = document.createElement("span"); n.className = "n";
    const items = (byPark[code] || []).slice().sort(function(a,b){ return catInfo(a.category).rank - catInfo(b.category).rank; });
    n.textContent = items.length ? items.length + (items.length === 1 ? " alert" : " alerts") : "no active alerts";
    h.append(n);
    const link = document.createElement("a"); link.href = "https://www.nps.gov/" + code + "/"; link.target = "_blank"; link.rel = "noopener"; link.textContent = "park page →";
    h.append(link);
    group.append(h);
    if (!items.length){
      const c = document.createElement("div"); c.className = "card-msg"; c.style.marginTop = ".6rem";
      c.textContent = "No active alerts for this park. Enjoy your visit.";
      group.append(c);
    } else {
      items.forEach(function(a){
        const ci = catInfo(a.category);
        const el = document.createElement("article"); el.className = "alert " + ci.cls;
        const cat = document.createElement("span"); cat.className = "cat " + ci.cls; cat.textContent = ci.label;
        const t = document.createElement("h3");
        if (a.url){ const link2 = document.createElement("a"); link2.href = a.url; link2.target = "_blank"; link2.rel = "noopener"; link2.textContent = a.title || "(untitled alert)"; t.append(link2); }
        else { t.textContent = a.title || "(untitled alert)"; }
        el.append(cat, t);
        if (a.description){ const d = document.createElement("div"); d.className = "desc"; d.textContent = a.description; el.append(d); }
        group.append(el);
      });
    }
    content.append(group);
  });
}

/* ---- boot ---- */
async function boot(){
  if (!getKey()){ showKeyCard(false); content.textContent = ""; return; }
  try { await loadParks(); } catch(e){ return; }
  if (!state.parks.length){ msgCard(app, "Couldn't load the park list", ["The NPS API didn't return any parks. Check your key or connection and retry."]); return; }
  renderPicker();
  loadAlerts();
}
boot();
</script>
</body>
</html>
